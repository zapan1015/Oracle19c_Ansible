- name: Ensure .ssh directory exists
  file:
    path: "/home/{{ item }}/.ssh"
    state: directory
    owner: "{{ item }}"
    group: oinstall
    mode: '0700'
  loop:
    - grid
    - oracle

- name: Generate SSH keys for grid and oracle users (PEM format) - Run on first node only
  shell: |
    rm -f /home/{{ item }}/.ssh/id_rsa /home/{{ item }}/.ssh/id_rsa.pub
    ssh-keygen -t rsa -b 2048 -m PEM -f /home/{{ item }}/.ssh/id_rsa -N '' -q
    chown {{ item }}:oinstall /home/{{ item }}/.ssh/id_rsa /home/{{ item }}/.ssh/id_rsa.pub
    chmod 600 /home/{{ item }}/.ssh/id_rsa
    chmod 644 /home/{{ item }}/.ssh/id_rsa.pub
  args:
    executable: /bin/bash
  loop:
    - grid
    - oracle
  when: inventory_hostname == groups['rac_nodes'][0]

- name: Slurp SSH keys from first node
  slurp:
    src: "/home/{{ item.0 }}/.ssh/{{ item.1 }}"
  register: ssh_keys_slurped
  loop: "{{ ['grid', 'oracle'] | product(['id_rsa', 'id_rsa.pub']) | list }}"
  when: inventory_hostname == groups['rac_nodes'][0]

- name: Distribute SSH keys to all nodes
  copy:
    dest: "/home/{{ item.1.0 }}/.ssh/{{ item.1.1 }}"
    content: "{{ hostvars[groups['rac_nodes'][0]]['ssh_keys_slurped']['results'] | selectattr('item', 'equalto', item.1) | map(attribute='content') | first | b64decode }}"
    owner: "{{ item.1.0 }}"
    group: oinstall
    mode: "{{ '0600' if item.1.1 == 'id_rsa' else '0644' }}"
  loop: "{{ groups['rac_nodes'] | product(['grid', 'oracle'] | product(['id_rsa', 'id_rsa.pub']) | list) | list }}"
  when: inventory_hostname != groups['rac_nodes'][0]

- name: Add standardized public keys to authorized_keys on all nodes
  authorized_key:
    user: "{{ item.0 }}"
    state: present
    key: "{{ hostvars[groups['rac_nodes'][0]]['ssh_keys_slurped']['results'] | selectattr('item', 'equalto', [item.0, 'id_rsa.pub']) | map(attribute='content') | first | b64decode }}"
  loop: "{{ ['grid', 'oracle'] | product(groups['rac_nodes']) | list }}"

- name: Configure SSH client for Oracle/Grid users
  blockinfile:
    path: "/home/{{ item }}/.ssh/config"
    create: yes
    owner: "{{ item }}"
    group: oinstall
    mode: '0600'
    block: |
      Host *
        StrictHostKeyChecking no
        PubkeyAcceptedKeyTypes +ssh-rsa
        HostKeyAlgorithms +ssh-rsa
        PasswordAuthentication no
  loop:
    - grid
    - oracle

- name: Create SCP wrapper for OL8 compatibility
  shell: |
    if [ ! -f /usr/bin/scp.orig ]; then
      mv /usr/bin/scp /usr/bin/scp.orig
    fi
    echo '#!/bin/bash' > /usr/bin/scp
    echo '/usr/bin/scp.orig -T "$@"' >> /usr/bin/scp
    chmod 555 /usr/bin/scp
  args:
    executable: /bin/bash
  when: ansible_distribution == 'OracleLinux' and ansible_distribution_major_version == '8'


- name: Populate known_hosts with unhashed RSA keys (JSch compatible)
  shell: |
    # Generate list of hosts and IPs (Public, Private, VIP, SCAN)
    HOSTS="localhost 127.0.0.1 rac-scan {{ scan_ip }}"
    {% for h in groups['rac_nodes'] %}
    # Public & Hostname
    HOSTS="$HOSTS {{ h }} {{ hostvars[h].ansible_host }}"
    # Private
    PRIV_IP="192.168.10.{{ 100 + loop.index }}"
    HOSTS="$HOSTS {{ h }}-priv $PRIV_IP"
    # VIP
    VIP_IP="192.168.56.{{ 110 + loop.index }}"
    HOSTS="$HOSTS {{ h }}-vip $VIP_IP"
    {% endfor %}
    
    # Clean up existing known_hosts
    > /home/{{ item }}/.ssh/known_hosts
    
    # Populate with unhashed entries
    for addr in $HOSTS; do
      ssh-keyscan -t rsa $addr 2>/dev/null >> /home/{{ item }}/.ssh/known_hosts
    done
    
    sort -u -o /home/{{ item }}/.ssh/known_hosts /home/{{ item }}/.ssh/known_hosts
    chown {{ item }}:oinstall /home/{{ item }}/.ssh/known_hosts
    chmod 644 /home/{{ item }}/.ssh/known_hosts
  loop:
    - grid
    - oracle
  args:
    executable: /bin/bash

- name: Verify SSH connectivity (grid)
  shell: "ssh -o BatchMode=yes {{ item }} hostname"
  become: yes
  become_user: grid
  loop: "{{ groups['rac_nodes'] }}"
  register: ssh_verify_grid
  ignore_errors: yes

- name: Verify SSH connectivity (oracle)
  shell: "ssh -o BatchMode=yes {{ item }} hostname"
  become: yes
  become_user: oracle
  loop: "{{ groups['rac_nodes'] }}"
  register: ssh_verify_oracle
  ignore_errors: yes
