---
# Grid Infrastructure Installation

- name: Create Grid Directories
  file:
    path: "{{ grid_home }}"
    state: directory
    owner: grid
    group: oinstall
    mode: '0775'

- name: Copy Grid Response File
  template:
    src: grid_19c.rsp.j2
    dest: "{{ grid_home }}/grid_19c.rsp"
    owner: grid
    group: oinstall
    mode: '0600'

- name: Check if Grid is already extracted
  stat:
    path: "{{ grid_home }}/gridSetup.sh"
  register: grid_extracted

- name: Clear Grid Home on other nodes (to avoid INS-44002)
  file:
    path: "{{ grid_home }}/"
    state: "{{ item }}"
    owner: grid
    group: oinstall
    mode: '0775'
  loop:
    - absent
    - directory
  when: inventory_hostname != groups['rac_nodes'][0]

- name: Unzip Grid Media - Run on first node only
  unarchive:
    src: "{{ oracle_grid_image }}"
    dest: "{{ grid_home }}"
    remote_src: yes
    owner: grid
    group: oinstall
  when: 
    - not grid_extracted.stat.exists
    - inventory_hostname == groups['rac_nodes'][0]

- name: Find cvuqdisk rpm (Node 1)
  find:
    paths: "{{ grid_home }}/cv/rpm"
    patterns: "cvuqdisk*.rpm"
  register: cvuqdisk_rpm
  when: inventory_hostname == groups['rac_nodes'][0]

- name: Fetch cvuqdisk RPM from Node 1
  fetch:
    src: "{{ cvuqdisk_rpm.files[0].path }}"
    dest: "/tmp/cvuqdisk.rpm"
    flat: yes
  when: inventory_hostname == groups['rac_nodes'][0]

- name: Copy cvuqdisk RPM to all nodes
  copy:
    src: "/tmp/cvuqdisk.rpm"
    dest: "/tmp/cvuqdisk.rpm"
    owner: grid
    group: oinstall
    mode: '0644'

- name: Install cvuqdisk package
  dnf:
    name: "/tmp/cvuqdisk.rpm"
    state: present
    disable_gpg_check: yes
  environment:
    CVUQDISK_GRP: oinstall
  become: yes

- name: Check if Grid is already installed
  stat:
    path: "{{ oracle_base }}/oraInventory/orainstRoot.sh"
  register: grid_already_installed

- name: Install Grid Infrastructure (Silent) - Run on first node only
  command: >
    {{ grid_home }}/gridSetup.sh -silent
    -responseFile {{ grid_home }}/grid_19c.rsp
    -ignorePrereq
    -waitforcompletion
  args:
    chdir: "{{ grid_home }}"
  become: yes
  become_user: grid
  environment:
    CV_ASSUME_DISTID: OL7

  register: grid_install
  failed_when: grid_install.rc not in [0, 6]
  when:
    - inventory_hostname == groups['rac_nodes'][0]
    - not grid_already_installed.stat.exists
  async: 3600
  poll: 30

- name: Run orainstRoot.sh
  command: "{{ oracle_base }}/oraInventory/orainstRoot.sh"
  become: yes

- name: Run root.sh (Serialized - one node at a time)
  command: "{{ grid_home }}/root.sh"
  become: yes
  throttle: 1
  async: 1800
  poll: 30

- name: Revert SCP wrapper after installation
  shell: |
    if [ -f /usr/bin/scp.orig ]; then
      mv -f /usr/bin/scp.orig /usr/bin/scp
    fi
  args:
    executable: /bin/bash
  when: ansible_distribution == 'OracleLinux' and ansible_distribution_major_version == '8'


- name: Create RECO Disk Group via ASMCA
  shell: |
    export ORACLE_HOME={{ grid_home }}
    export ORACLE_SID=+ASM{{ play_hosts.index(inventory_hostname) + 1 }}
    {{ grid_home }}/bin/asmca -silent \
      -createDiskGroup \
      -diskGroupName RECO \
      -diskList '{{ asm_disks | selectattr("diskgroup", "equalto", "RECO") | map(attribute="device") | join(",") }}' \
      -redundancy EXTERNAL \
      -au_size 4
  become: yes
  become_user: grid
  when: inventory_hostname == groups['rac_nodes'][0]
  ignore_errors: yes
