---
# Database Software Installation & DBCA

- name: Create Database Home
  file:
    path: "{{ db_home }}"
    state: directory
    owner: oracle
    group: oinstall
    mode: '0775'

- name: Check if DB Software is already extracted
  stat:
    path: "{{ db_home }}/runInstaller"
  register: db_extracted

- name: Unzip DB Media
  unarchive:
    src: "{{ oracle_db_image }}"
    dest: "{{ db_home }}"
    remote_src: yes
    owner: oracle
    group: oinstall
  when: not db_extracted.stat.exists

- name: Copy DB Response File
  template:
    src: db_install.rsp.j2
    dest: "{{ db_home }}/db_install.rsp"
    owner: oracle
    group: oinstall

- name: Install Database Software (Silent) - Run on first node only
  command: >
    {{ db_home }}/runInstaller -silent
    -responseFile {{ db_home }}/db_install.rsp
    -ignorePrereq
    -waitforcompletion
  args:
    chdir: "{{ db_home }}"
  become: yes
  become_user: oracle
  register: db_install
  failed_when: db_install.rc not in [0, 6]
  ignore_errors: yes
  when: inventory_hostname == groups['rac_nodes'][0]
  async: 3600
  poll: 30

- name: Run root.sh for DB
  command: "{{ db_home }}/root.sh"
  become: yes

- name: Create RAC Database (DBCA)
  command: >
    {{ db_home }}/bin/dbca -silent -createDatabase
    -templateName General_Purpose.dbc
    -gdbname {{ db_name }}
    -sid {{ db_name }}
    -responseFile NO_VALUE
    -characterSet AL32UTF8
    -sysPassword oracle
    -systemPassword oracle
    -databaseConfigType RAC
    -createAsContainerDatabase true
    -pdbName {{ pdb_name }}
    -nodelist {{ groups['rac_nodes'] | join(',') }}
    -storageType ASM
    -diskGroupName +DATA
    -recoveryGroupName +RECO
  become: yes
  become_user: oracle
  register: db_create
  ignore_errors: yes
  when: inventory_hostname == groups['rac_nodes'][0]
  async: 7200
  poll: 60
